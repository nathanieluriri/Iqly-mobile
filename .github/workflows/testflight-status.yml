name: testflight-status

# Reads App Store Connect with the same API key the iOS upload uses.
# Prints recent builds for net.iqly.app. Does not upload anything.
on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Apple secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name secret"
              exit 1
            fi
          done
      - name: Restore the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: List recent TestFlight builds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet 'pyjwt[crypto]'
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          with open(os.environ["ASC_KEY_PATH"], "r", encoding="utf-8") as fh:
              private_key = fh.read()
          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": issuer,
                  "iat": now,
                  "exp": now + 12 * 60,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )

          def get(path: str) -> dict:
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as err:
                  body = err.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"App Store Connect {err.code} on {path}: {body}") from err

          apps = get("/v1/apps?filter[bundleId]=net.iqly.app")
          if not apps.get("data"):
              raise SystemExit("No App Store Connect app for net.iqly.app")
          app = apps["data"][0]
          print(f"app: {app['attributes'].get('name')} ({app['id']})")
          query = urllib.parse.urlencode(
              {
                  "filter[app]": app["id"],
                  "sort": "-uploadedDate",
                  "limit": "8",
                  "include": "preReleaseVersion,buildBetaDetail",
              }
          )
          payload = get(f"/v1/builds?{query}")
          included = {
              item["id"]: item
              for item in payload.get("included") or []
          }
          builds = payload.get("data") or []
          if not builds:
              raise SystemExit("No builds uploaded for this app yet")
          for build in builds:
              attrs = build["attributes"]
              rels = build.get("relationships") or {}
              version_id = (rels.get("preReleaseVersion") or {}).get("data") or {}
              detail_id = (rels.get("buildBetaDetail") or {}).get("data") or {}
              pre = included.get(version_id.get("id") or "", {}).get("attributes") or {}
              detail = included.get(detail_id.get("id") or "", {}).get("attributes") or {}
              marketing = pre.get("version") or "?"
              number = attrs.get("version") or "?"
              print(
                  f"{marketing} ({number})  "
                  f"uploaded={attrs.get('uploadedDate')}  "
                  f"processing={attrs.get('processingState')}  "
                  f"internal={detail.get('internalBuildState')}  "
                  f"external={detail.get('externalBuildState')}"
              )
          PY
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
