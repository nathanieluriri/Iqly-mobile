name: shorebird-init

# Temporary: registers the app with Shorebird once and prints the app_id,
# which is not a secret, so it can be committed in shorebird.yaml.
on:
  pull_request:
    paths: [.github/workflows/shorebird-init.yml]

jobs:
  init:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - run: shorebird --version
      - name: Register the app
        run: |
          if [ -f shorebird.yaml ]; then
            echo "Already registered"
            exit 0
          fi
          shorebird init --display-name iQLY
          echo "----- shorebird.yaml -----"
          cat shorebird.yaml
          echo "----- changes -----"
          git diff
      - run: shorebird flutter versions list
