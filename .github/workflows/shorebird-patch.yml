name: shorebird-patch

# Ships the Dart in this branch as an update to a release made by
# shorebird-release. Phones download it in the background and run it from
# their next launch. Published to the stable track so every install of that
# release gets it. Native code, the manifest, assets and the Flutter
# version cannot be patched: those need a new release.
#
# Android and iOS both get a patch. Use latest so each store line
# (Play 1.0.0+11, TestFlight 1.0.0+12) is patched on its own version.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Android release to patch, as pubspec.yaml had it (0.1.0+1), or latest
        required: true
        default: latest
      ios_release_version:
        description: iOS release to patch, as pubspec.yaml had it (0.1.0+1), or latest
        required: true
        default: latest
      allow_diffs:
        description: Publish the Dart patch even when native or asset files differ
        type: boolean
        required: false
        default: false
      platforms:
        description: Platforms to patch
        type: choice
        required: true
        default: both
        options:
          - both
          - android
          - ios

jobs:
  android:
    if: inputs.platforms != 'ios'
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - run: flutter pub get
      - name: Check Shorebird token
        run: |
          if [ -z "$SHOREBIRD_TOKEN" ]; then
            echo "SHOREBIRD_TOKEN is required" >&2
            exit 1
          fi
      - run: dart run tool/gen_tokens.dart --check
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iqly-upload.jks"
          echo "IQLY_KEYSTORE_PATH=$RUNNER_TEMP/iqly-upload.jks" >> "$GITHUB_ENV"
      - run: |
          set -e
          for attempt in 1 2 3 4 5; do
            if shorebird patch android --release-version="$RELEASE_VERSION" --track=stable $DIFFS; then
              exit 0
            fi
            echo "Android patch attempt $attempt failed. Waiting before retry."
            sleep $((attempt * 45))
          done
          exit 1
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          DIFFS: ${{ inputs.allow_diffs && '--allow-native-diffs --allow-asset-diffs' || '' }}
          IQLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IQLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IQLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  ios:
    if: inputs.platforms != 'android'
    runs-on: xcode-27
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - run: shorebird patch ios --no-codesign --release-version="$RELEASE_VERSION" --track=stable $DIFFS
        env:
          RELEASE_VERSION: ${{ inputs.ios_release_version }}
          DIFFS: ${{ inputs.allow_diffs && '--allow-native-diffs --allow-asset-diffs' || '' }}
