name: shorebird-patch

# Ships the Dart in this branch as an update to a release made by
# shorebird-release. Phones download it in the background and run it from
# their next launch. Native code, the manifest, assets and the Flutter
# version cannot be patched: those need a new release.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Release to patch, as pubspec.yaml had it (0.1.0+1), or latest
        required: true
        default: latest

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iqly-upload.jks"
          echo "IQLY_KEYSTORE_PATH=$RUNNER_TEMP/iqly-upload.jks" >> "$GITHUB_ENV"
      - run: shorebird patch android --release-version="$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          IQLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IQLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IQLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
