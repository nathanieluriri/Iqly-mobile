name: apk

# A signed release APK to install on a phone, kept as a run artifact for
# 14 days. Builds on every push to dev, or on demand from the Actions tab.
on:
  push:
    branches: [dev]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/apk.yml]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/iqly-upload.jks"
          echo "IQLY_KEYSTORE_PATH=$RUNNER_TEMP/iqly-upload.jks" >> "$GITHUB_ENV"
      - run: flutter build apk --release
        env:
          IQLY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IQLY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IQLY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Name the APK after the commit
        run: mv build/app/outputs/flutter-apk/app-release.apk "iqly-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: iqly-android
          path: iqly-*.apk
          retention-days: 14
