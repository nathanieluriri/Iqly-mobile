name: shorebird-release-ios

# The iOS release, built through Shorebird so later Dart-only changes can be
# patched onto iPhones and iPads too, then signed and sent to App Store
# Connect, where it shows up in TestFlight. Run it from the Actions tab once
# the version in pubspec.yaml is new. It needs four repository secrets from
# the Apple Developer account: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID and
# ASC_KEY_P8_BASE64 (the .p8 key, base64 encoded). Signing is automatic:
# Xcode creates the certificate and profile through the API key, so the key
# needs the Admin or App Manager role.
#
# Apple rejects uploads built with the default Xcode on macos-15 (16.4,
# iOS 18.5 SDK). From April 2027 it also wants the iOS 27 SDK, so this
# job pins GitHub's Xcode 27.2 image and selects that toolchain explicitly.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Send the build to App Store Connect (TestFlight)
        type: boolean
        default: true
      replace:
        description: Delete this version on iOS in Shorebird first (only if that build never reached TestFlight)
        type: boolean
        default: false
      check_only:
        description: Only list TestFlight builds with the App Store Connect key
        type: boolean
        default: false
      setup_testers:
        description: Create the Internal Testing group if it is missing
        type: boolean
        default: false

jobs:
  testers:
    if: ${{ inputs.setup_testers }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the Apple secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name secret"
              exit 1
            fi
          done
      - name: Restore the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Create the Internal Testing group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet 'pyjwt[crypto]'
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          with open(os.environ["ASC_KEY_PATH"], "r", encoding="utf-8") as fh:
              private_key = fh.read()
          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": issuer,
                  "iat": now,
                  "exp": now + 12 * 60,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )

          def call(method: str, path: str, body: dict | None = None) -> dict:
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as err:
                  text = err.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"App Store Connect {err.code} on {path}: {text}") from err

          apps = call("GET", "/v1/apps?filter[bundleId]=net.iqly.app")
          if not apps.get("data"):
              raise SystemExit("No App Store Connect app for net.iqly.app")
          app_id = apps["data"][0]["id"]
          query = urllib.parse.urlencode({"filter[app]": app_id, "limit": "50"})
          groups = call("GET", f"/v1/betaGroups?{query}").get("data") or []
          internal = [
              g
              for g in groups
              if g.get("attributes", {}).get("isInternalGroup")
          ]
          if internal:
              for group in internal:
                  name = group["attributes"].get("name")
                  print(f"internal group already exists: {name} ({group['id']})")
          else:
              created = call(
                  "POST",
                  "/v1/betaGroups",
                  {
                      "data": {
                          "type": "betaGroups",
                          "attributes": {
                              "name": "Team",
                              "isInternalGroup": True,
                          },
                          "relationships": {
                              "app": {
                                  "data": {"type": "apps", "id": app_id},
                              }
                          },
                      }
                  },
              )
              group = created["data"]
              print(
                  f"created internal group: "
                  f"{group['attributes'].get('name')} ({group['id']})"
              )
          PY
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  status:
    if: ${{ inputs.check_only }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the Apple secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name secret"
              exit 1
            fi
          done
      - name: Restore the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: List recent TestFlight builds
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet 'pyjwt[crypto]'
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          key_id = os.environ["ASC_KEY_ID"]
          issuer = os.environ["ASC_ISSUER_ID"]
          with open(os.environ["ASC_KEY_PATH"], "r", encoding="utf-8") as fh:
              private_key = fh.read()
          now = int(time.time())
          token = jwt.encode(
              {
                  "iss": issuer,
                  "iat": now,
                  "exp": now + 12 * 60,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )

          def get(path: str) -> dict:
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as err:
                  body = err.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"App Store Connect {err.code} on {path}: {body}") from err

          apps = get("/v1/apps?filter[bundleId]=net.iqly.app")
          if not apps.get("data"):
              raise SystemExit("No App Store Connect app for net.iqly.app")
          app = apps["data"][0]
          print(f"app: {app['attributes'].get('name')} ({app['id']})")
          query = urllib.parse.urlencode(
              {
                  "filter[app]": app["id"],
                  "sort": "-uploadedDate",
                  "limit": "8",
                  "include": "preReleaseVersion,buildBetaDetail",
              }
          )
          payload = get(f"/v1/builds?{query}")
          included = {item["id"]: item for item in payload.get("included") or []}
          builds = payload.get("data") or []
          if not builds:
              raise SystemExit("No builds uploaded for this app yet")
          for build in builds:
              attrs = build["attributes"]
              rels = build.get("relationships") or {}
              version_id = (rels.get("preReleaseVersion") or {}).get("data") or {}
              detail_id = (rels.get("buildBetaDetail") or {}).get("data") or {}
              pre = included.get(version_id.get("id") or "", {}).get("attributes") or {}
              detail = included.get(detail_id.get("id") or "", {}).get("attributes") or {}
              marketing = pre.get("version") or "?"
              number = attrs.get("version") or "?"
              print(
                  f"{marketing} ({number})  "
                  f"uploaded={attrs.get('uploadedDate')}  "
                  f"processing={attrs.get('processingState')}  "
                  f"internal={detail.get('internalBuildState')}  "
                  f"external={detail.get('externalBuildState')}"
              )
          PY
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  release:
    if: ${{ !inputs.check_only && !inputs.setup_testers }}
    runs-on: xcode-27-arm64
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify the pinned Xcode and iOS SDK
        run: |
          xcodebuild -version
          test "$(xcodebuild -version | sed -n 's/^Xcode //p')" = "27.2"
          xcodebuild -showsdks | grep -q 'iphoneos27.2'
      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true
      - name: Check the Apple secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Add the $name secret (see docs/ios-app-store.md in the platform repo)"
              exit 1
            fi
          done
      - name: Restore the App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Drop this version on iOS in Shorebird
        if: ${{ inputs.replace }}
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          shorebird releases delete --release-version "$version" --platform ios --yes
      # Unsigned here; the export below signs with the API key, which also
      # creates the distribution certificate and profile on first run.
      # Flutter version must match the Android 1.0 line on the same release.
      - run: shorebird release ios --no-codesign --flutter-version=3.50.1
      - name: Write the export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DESTINATION: ${{ inputs.upload && 'upload' || 'export' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
      - name: Sign, export and send to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Name the file after the version
        if: ${{ !inputs.upload }}
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          mv build/ios/ipa/*.ipa "iqly-$version.ipa"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.upload }}
        with:
          name: iqly-release-ios
          path: iqly-*.ipa
          retention-days: 90
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
