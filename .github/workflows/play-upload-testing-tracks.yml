name: play-upload-testing-tracks

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Shorebird release workflow run containing the AAB artifact
        required: true
        type: string
      artifact_name:
        description: GitHub Actions artifact name
        default: iqly-release
        required: true
        type: string
      discard_production_draft:
        description: Discard a production draft with the same version code before uploading
        default: false
        required: true
        type: boolean
      reference_existing:
        description: Assign the already uploaded version code to testing tracks without uploading again
        default: false
        required: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: play-testing-tracks-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify upload workflow contract
        run: |
          python3 -m pip install --quiet pyyaml
          python3 tool/test_play_upload_workflow.py
      - name: Download existing release artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          run_id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: artifacts
      - name: Select the AAB
        run: |
          set -euo pipefail
          mapfile -t bundles < <(find artifacts -type f -name '*.aab' -print)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one AAB, found ${#bundles[@]}"
            exit 1
          fi
          echo "AAB_PATH=${bundles[0]}" >> "$GITHUB_ENV"
          echo "AAB_SHA256=$(sha256sum "${bundles[0]}" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Discard production draft for this version code
        if: inputs.discard_production_draft
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          export VERSION_CODE="${version##*+}"
          python3 -m pip install --quiet google-api-python-client google-auth
          python3 <<'PY'
          import json
          import os

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          info = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          service = build(
              "androidpublisher", "v3", credentials=credentials, cache_discovery=False
          )
          package_name = "net.iqly.app"
          version_code = os.environ["VERSION_CODE"]
          edit_id = None
          committed = False
          try:
              edit_id = service.edits().insert(
                  packageName=package_name, body={}
              ).execute()["id"]
              track = service.edits().tracks().get(
                  packageName=package_name, editId=edit_id, track="production"
              ).execute()
              releases = track.get("releases", [])
              matching = [
                  release
                  for release in releases
                  if version_code in [str(code) for code in release.get("versionCodes", [])]
              ]
              if not matching:
                  print(f"No production release uses version code {version_code}.")
                  raise SystemExit(0)
              for release in matching:
                  if release.get("status") != "draft":
                      raise SystemExit(
                          "Refusing to discard a non-draft production release "
                          f"for version code {version_code}."
                      )
              remaining = [release for release in releases if release not in matching]
              service.edits().tracks().update(
                  packageName=package_name,
                  editId=edit_id,
                  track="production",
                  body={"releases": remaining},
              ).execute()
              service.edits().commit(
                  packageName=package_name, editId=edit_id
              ).execute()
              committed = True
              print(f"Discarded production draft for version code {version_code}.")
          finally:
              if edit_id and not committed:
                  service.edits().delete(
                      packageName=package_name, editId=edit_id
                  ).execute()
          PY
      - name: Assign existing version code to testing tracks
        if: inputs.reference_existing
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          export VERSION_CODE="${version##*+}"
          export VERSION_NAME="$version"
          python3 -m pip install --quiet google-api-python-client google-auth
          python3 <<'PY'
          import json
          import os

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          info = json.loads(os.environ["PLAY_SERVICE_ACCOUNT_JSON"])
          credentials = service_account.Credentials.from_service_account_info(
              info,
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          service = build(
              "androidpublisher", "v3", credentials=credentials, cache_discovery=False
          )
          package_name = "net.iqly.app"
          version_code = os.environ["VERSION_CODE"]
          version_name = os.environ["VERSION_NAME"]
          edit_id = None
          committed = False
          try:
              edit_id = service.edits().insert(
                  packageName=package_name, body={}
              ).execute()["id"]
              for track_name in ["internal", "alpha", "beta"]:
                  try:
                      track = service.edits().tracks().get(
                          packageName=package_name, editId=edit_id, track=track_name
                      ).execute()
                  except HttpError as error:
                      if error.resp.status != 404:
                          raise
                      track = {}
                  releases = [
                      release
                      for release in track.get("releases", [])
                      if version_code
                      not in [str(code) for code in release.get("versionCodes", [])]
                  ]
                  releases.append(
                      {
                          "name": f"{version_name} ({version_code})",
                          "versionCodes": [version_code],
                          "status": "completed",
                      }
                  )
                  service.edits().tracks().update(
                      packageName=package_name,
                      editId=edit_id,
                      track=track_name,
                      body={"releases": releases},
                  ).execute()
              service.edits().commit(
                  packageName=package_name, editId=edit_id
              ).execute()
              committed = True
              print(f"Assigned version code {version_code} to internal, alpha, and beta.")
          finally:
              if edit_id and not committed:
                  service.edits().delete(
                      packageName=package_name, editId=edit_id
                  ).execute()
          PY
      - name: Upload AAB to internal alpha and beta
        if: ${{ !inputs.reference_existing }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: net.iqly.app
          releaseFiles: ${{ env.AAB_PATH }}
          tracks: internal,alpha,beta
          status: completed
