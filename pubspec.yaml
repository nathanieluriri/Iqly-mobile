name: iqly_mobile
description: "The iQLY contributor app for Android, iOS and Windows."
publish_to: 'none'
version: 0.6.0+7

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.0
  go_router: ^18.0.2
  intl: ^0.20.3
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  quick_actions: ^1.1.1
  file_picker: ^13.1.0
  image_picker: ^1.2.4
  path_parsing: ^1.1.0
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  shorebird_code_push: ^2.0.7
  onesignal_flutter: ^5.7.1
  sqflite: ^2.4.4+2
  video_player: ^2.14.1
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  fake_async: ^1.3.3
  sqflite_common_ffi: ^2.4.4

# The local store tests run on the machine's own SQLite, as the phones do,
# so no test run or debug build downloads one.
hooks:
  user_defines:
    sqlite3:
      source: system

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/icons/
    - assets/illustrations/
    - assets/samples/covers/
    - assets/samples/logos/
    - assets/splash/
    - assets/vectors/
    - shorebird.yaml

  fonts:
    - family: Bricolage Grotesque 32pt
      fonts:
        - asset: assets/fonts/BricolageGrotesque-32pt.ttf
          weight: 700
    - family: Bricolage Grotesque 30pt
      fonts:
        - asset: assets/fonts/BricolageGrotesque-30pt.ttf
          weight: 800
    - family: Bricolage Grotesque 28pt
      fonts:
        - asset: assets/fonts/BricolageGrotesque-28pt.ttf
          weight: 700
    - family: Bricolage Grotesque 22pt
      fonts:
        - asset: assets/fonts/BricolageGrotesque-22pt.ttf
          weight: 700
    - family: Bricolage Grotesque 17pt
      fonts:
        - asset: assets/fonts/BricolageGrotesque-17pt.ttf
          weight: 700
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-SemiBold.ttf
          weight: 600
